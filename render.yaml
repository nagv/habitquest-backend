  #     - fromGroup: habitquest-settings

databases:
  - name: habitquest-db
    region: virginia
    plan: free

envVarGroups:
  - name: habitquest-settings
    envVars:
      - key: MODEL_MODE
        value: fake            # google or openai once that provider's values below are set
      - key: GOOGLE_MODEL
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_BASE_URL   # any OpenAI-compatible endpoint, e.g. Nebius
        sync: false
      - key: OPENAI_MODEL      # must support tool calling
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true    # dev tokens only; switch to Supabase Auth (JWT_JWKS_URL) for real users
      - key: JWT_ISSUER
        value: https://habitquest-api.onrender.com/dev
      - key: DEV_LOGIN         # /docs username/password login; remove when using Supabase Auth
        value: "true"
      - key: DEV_LOGIN_PASSWORD  # shared tester password, 12+ characters
        sync: false
      - key: LOCAL_DEMO_AUTH
        value: "false"
      - key: LANGSMITH_TRACING
        value: "false"
      - key: LANGCHAIN_TRACING_V2
        value: "false"
